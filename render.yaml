# Render 一键部署配置
# 免费套餐：750h/月，15 分钟无请求会休眠
# 保持唤醒：去 uptimerobot.com 添加免费监控，每 5 分钟 ping 一次即可

services:
  - type: web
    name: study-planner
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: RENDER
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: SITE_BASE_URL
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: FEISHU_WEBHOOK_URL
        sync: false
