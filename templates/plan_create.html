<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="stylesheet" href="/static/style.css">
    <title>创建计划 — Study Planner</title>
</head>
<body>
    <div class="app-container">
        <nav class="top-nav">
            <div class="nav-left">
                <span class="nav-brand">Planner</span>
            </div>
            <div class="nav-actions">
                <a href="/" class="nav-btn">取消</a>
            </div>
        </nav>

        <div class="page-header">
            <h1 class="page-title">创建计划</h1>
        </div>

        {% if existing and not error %}
        <div class="info-banner">检测到已有活跃计划「{{ existing.name }}」，创建新计划将自动归档旧计划。</div>
        {% endif %}
        {% if error %}
        <div class="error-banner">{{ error }}</div>
        {% endif %}

        <form method="POST" id="planForm">
            <input type="hidden" name="user_ds_key" id="userDsKeyField" value="">
            <div class="form-section">
                <div class="form-card">
                    <div class="form-card-label">考试信息</div>
                    <div class="form-card-body">
                        <div class="form-group">
                            <label for="exam_date">考试日期</label>
                            <input type="date" id="exam_date" name="exam_date" required min="{{ today }}">
                        </div>
                        <div class="form-group">
                            <label for="exam_name">计划名称</label>
                            <input type="text" id="exam_name" name="exam_name" value="专升本备考计划" placeholder="给你的备考计划起个名字">
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <div class="form-card">
                    <div class="form-card-label">当前水平</div>
                    <div class="form-card-body">
                        <div class="form-group">
                            <label for="math_level">高数水平</label>
                            <select id="math_level" name="math_level" required>
                                <option value="">—— 请选择 ——</option>
                                <option value="零基础">零基础（几乎没学过）</option>
                                <option value="有基础但不扎实">有基础但不扎实（学过但忘了）</option>
                                <option value="基础较好">基础较好（概念清楚，需刷题提升）</option>
                                <option value="基础扎实">基础扎实（系统学过，冲刺拔高）</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="english_level">英语水平</label>
                            <select id="english_level" name="english_level" required>
                                <option value="">—— 请选择 ——</option>
                                <option value="基础薄弱">基础薄弱（词汇量少，语法不熟）</option>
                                <option value="中等水平">中等水平（四级或相当）</option>
                                <option value="较好水平">较好水平（六级或相当）</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <div class="form-card">
                    <div class="form-card-label">学习安排</div>
                    <div class="form-card-body">
                        <div class="form-group">
                            <label for="daily_hours">每天可用学习时间（小时）</label>
                            <input type="number" id="daily_hours" name="daily_hours"
                                   min="1" max="12" step="0.5" value="4" required>
                        </div>
                        <div class="form-group">
                            <label for="weak_subjects">薄弱环节（选填）</label>
                            <textarea id="weak_subjects" name="weak_subjects" rows="2"
                                      placeholder="例如：积分运算不熟练、阅读速度慢……"></textarea>
                        </div>
                    </div>
                </div>
            </div>

            <div style="padding: 8px 16px;">
                <button type="submit" class="btn primary large" id="submitBtn" style="width:100%;">
                    AI 生成备考计划
                </button>
            </div>
            <p class="form-hint">AI 将根据你的信息生成三阶段备考计划，预计 10-30 秒。</p>
        </form>
    </div>

    <script>
        document.getElementById('userDsKeyField').value = localStorage.getItem('user_ds_key') || '';
        const today = new Date();
        const defaultExam = new Date(today);
        defaultExam.setMonth(today.getMonth() + 10);
        document.getElementById('exam_date').value = defaultExam.toISOString().split('T')[0];
        document.getElementById('exam_date').min = new Date(today.getTime() + 86400000).toISOString().split('T')[0];
        document.getElementById('planForm').addEventListener('submit', function() {
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'AI 正在生成计划……';
        });
    </script>
</body>
</html>
